---
layout: default
---
<div class="post-header">
  <div class="wrap">
    {% if page.tags %}
      {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
    {% endif %}
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%-d %B %Y" }}{% if page.author %} &middot; {{ page.author }}{% endif %}</p>
  </div>
</div>
<div class="wrap">
  <article class="post-content">
    {{ content }}
  </article>
  <p style="text-align:center; margin-top:48px;">
    <a class="btn btn-outline" href="{{ '/blog/' | relative_url }}">&larr; Back to the blog</a>
  </p>
</div>

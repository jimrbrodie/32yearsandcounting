<footer class="site-footer">
  <div class="wrap">
    <img class="footer-mark" src="{{ '/assets/img/logo-mark.jpg' | relative_url }}" alt="{{ site.title }} logo">
    <p>{{ site.title }} &mdash; {{ site.tagline }}</p>
    <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author_names }}. Made with love, one post at a time.</p>
    <p><a href="{{ '/contact/' | relative_url }}">Say hello</a> &middot; <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  </div>
</footer>
